    <style>
        /* Custom OS Styling & Scrollbars */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-dark: rgba(24, 24, 28, 0.82);
            --glass-border: rgba(255, 255, 255, 0.35);
            --win-accent: #0067c0;
            --win-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 1px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* Allow text selection inside specific readable areas & inputs */
        .selectable, input, textarea {
            user-select: text;
        }

        /* Wallpapers */
        .wallpaper-1 {
            background: radial-gradient(circle at 20% 25%, #3b82f6 0%, transparent 45%),
                        radial-gradient(circle at 80% 75%, #8b5cf6 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #0ea5e9 0%, #090d16 100%);
        }
        .wallpaper-2 {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        }
        .wallpaper-3 {
            background: radial-gradient(circle at 75% 20%, #f43f5e 0%, transparent 45%),
                        radial-gradient(circle at 20% 80%, #f59e0b 0%, transparent 50%),
                        linear-gradient(135deg, #1e1b4b 0%, #09090b 100%);
        }
        .wallpaper-4 {
            background: radial-gradient(circle at 30% 30%, #10b981 0%, transparent 45%),
                        radial-gradient(circle at 75% 70%, #06b6d4 0%, transparent 50%),
                        linear-gradient(160deg, #022c22 0%, #090d16 100%);
        }

        /* Mica / Acrylic Glassmorphism */
        .win-glass {
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .win-glass-dark {
            background: rgba(20, 22, 28, 0.84);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        /* Desktop Icons */
        .desktop-icon {
            width: 84px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .desktop-icon.selected {
            background-color: rgba(59, 130, 246, 0.32);
            border-color: rgba(96, 165, 250, 0.6);
        }

        /* Window Animations & Resizing */
        .os-window {
            position: absolute;
            border-radius: 10px;
            box-shadow: var(--win-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 310px;
            min-height: 240px;
        }

        .os-window.opening {
            animation: winOpen 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .os-window.minimized {
            opacity: 0;
            transform: scale(0.85) translateY(60px);
            pointer-events: none;
        }

        .os-window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0 !important;
        }

        @keyframes winOpen {
            from {
                opacity: 0;
                transform: scale(0.93) translateY(14px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Start Menu Animation */
        #start-menu {
            transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom center;
        }
        #start-menu.hidden-menu {
            opacity: 0;
            transform: translateY(20px) scale(0.97);
            pointer-events: none;
        }

        /* Custom Scrollbars inside windows */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.45);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }

        /* Terminal Font */
        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
            z-index: 20;
        }

        /* Print styles for Resume */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-resume, #printable-resume * {
                visibility: visible;
            }
            #printable-resume {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>

                const app = APPS[id];
                if (!app) return;

                const isOpen = Boolean(winState);

                win.minimized = false;
                const el = document.getElementById(`win-${appId}`);
                if (el) el.classList.remove("minimized");
                focusWindow(appId);
            } else if (win.zIndex === topZIndex) {
                minimizeWindow(appId);
            } else {
                focusWindow(appId);

        /**

         * 5. WINDOW MANAGER (OPEN, CLOSE, MINIMIZE, MAXIMIZE, DRAG, RESIZE)
         * ===================================================================
         */
        function openApp(appId, customPayload = null) {
            const app = APPS[appId];
            if (!app) return;

            // If already open, restore & focus
            if (openWindows[appId]) {
                const winEl = document.getElementById(`win-${appId}`);
                openWindows[appId].minimized = false;
                winEl.classList.remove("minimized");
                if (customPayload && appId === "projects") {
                    renderProjectDetail(customPayload);
                }
                focusWindow(appId);
                return;
            }

            topZIndex++;
            const isMobile = window.innerWidth < 768;
            const winW = isMobile ? window.innerWidth - 16 : Math.min(app.width, window.innerWidth - 40);
            const winH = isMobile ? window.innerHeight - 68 : Math.min(app.height, window.innerHeight - 80);

            // Cascade position slightly for each new window
            const offset = (Object.keys(openWindows).length % 6) * 26;
            const left = isMobile ? 8 : Math.max(24, Math.floor((window.innerWidth - winW) / 2) + offset - 40);
            const top = isMobile ? 8 : Math.max(16, Math.floor((window.innerHeight - 48 - winH) / 2) + offset - 30);

            openWindows[appId] = {
                id: appId,
                minimized: false,
                maximized: isMobile,
                zIndex: topZIndex
            };

            const winEl = document.createElement("div");
            winEl.id = `win-${appId}`;
            winEl.className = `os-window win-glass opening pointer-events-auto ${isMobile ? "maximized" : ""}`;
            winEl.style.width = `${winW}px`;
            winEl.style.height = `${winH}px`;
            winEl.style.left = `${left}px`;
            winEl.style.top = `${top}px`;
            winEl.style.zIndex = topZIndex;

            winEl.addEventListener("mousedown", () => focusWindow(appId));
            winEl.addEventListener("touchstart", () => focusWindow(appId), { passive: true });

            winEl.innerHTML = `
                <!-- Title Bar -->
                <div class="win-titlebar h-10 px-3.5 bg-white/70 border-b border-slate-200/80 flex items-center justify-between cursor-move shrink-0" ondblclick="toggleMaximizeWindow('${appId}')">

                    </div>

                        <button onclick="minimizeWindow('${appId}')" title="Minimize" class="w-8 h-7 rounded hover:bg-slate-200/80 flex items-center justify-center text-slate-600 transition">
                            <i class="fa-solid fa-minus text-[11px]"></i>
                        </button>

                            <i class="fa-regular fa-square text-[11px]"></i>
                        </button>
                        <button onclick="closeWindow('${appId}')" title="Close" class="w-8 h-7 rounded hover:bg-red-500 hover:text-white flex items-center justify-center text-slate-600 transition">
                            <i class="fa-solid fa-xmark text-xs"></i>

                <!-- App Content Body -->

        function focusWindow(appId) {
            if (!openWindows[appId]) return;
            topZIndex++;
            openWindows[appId].zIndex = topZIndex;
            const winEl = document.getElementById(`win-${appId}`);
            if (winEl) winEl.style.zIndex = topZIndex;

        function closeWindow(appId) {
            const winEl = document.getElementById(`win-${appId}`);
            if (winEl) {
                winEl.style.opacity = "0";
                winEl.style.transform = "scale(0.94)";
                setTimeout(() => winEl.remove(), 150);
            }
            delete openWindows[appId];
            renderTaskbarApps();
        }

        function minimizeWindow(appId) {
            if (!openWindows[appId]) return;
            openWindows[appId].minimized = true;
            const winEl = document.getElementById(`win-${appId}`);
            if (winEl) winEl.classList.add("minimized");
            renderTaskbarApps();
        }

        function minimizeAllWindows() {
            Object.keys(openWindows).forEach(id => minimizeWindow(id));
        }

        function toggleMaximizeWindow(appId) {
            const winState = openWindows[appId];
            const winEl = document.getElementById(`win-${appId}`);
            if (!winState || !winEl) return;

            winState.maximized = !winState.maximized;
            winEl.classList.toggle("maximized", winState.maximized);
            focusWindow(appId);
        }

        function makeWindowDraggable(winEl, appId) {
            const titleBar = winEl.querySelector(".win-titlebar");
            let isDragging = false, startX, startY, origLeft, origTop;

            const startDrag = (clientX, clientY) => {
                if (openWindows[appId]?.maximized) return;
                isDragging = true;
                startX = clientX;
                startY = clientY;
                origLeft = winEl.offsetLeft;
                origTop = winEl.offsetTop;
                focusWindow(appId);
            };

            const onDrag = (clientX, clientY) => {
                if (!isDragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                const newTop = Math.max(0, Math.min(window.innerHeight - 85, origTop + dy));
                const newLeft = Math.max(-winEl.offsetWidth + 100, Math.min(window.innerWidth - 100, origLeft + dx));
                winEl.style.top = `${newTop}px`;
                winEl.style.left = `${newLeft}px`;
            };

            const stopDrag = () => { isDragging = false; };

            titleBar.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
            window.addEventListener("mousemove", (e) => onDrag(e.clientX, e.clientY));
            window.addEventListener("mouseup", stopDrag);

            titleBar.addEventListener("touchstart", (e) => {
                if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener("touchmove", (e) => {
                if (isDragging && e.touches.length === 1) onDrag(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener("touchend", stopDrag);
        }

        function initResize(e, appId) {
            e.stopPropagation();
            if (openWindows[appId]?.maximized) return;
            const winEl = document.getElementById(`win-${appId}`);
            const startX = e.clientX;
            const startY = e.clientY;
            const startW = winEl.offsetWidth;
            const startH = winEl.offsetHeight;

            const doResize = (moveEvent) => {
                const newW = Math.max(320, startW + (moveEvent.clientX - startX));
                const newH = Math.max(250, startH + (moveEvent.clientY - startY));
                winEl.style.width = `${newW}px`;
                winEl.style.height = `${newH}px`;
            };

            const stopResize = () => {
                window.removeEventListener("mousemove", doResize);
                window.removeEventListener("mouseup", stopResize);
            };

            window.addEventListener("mousemove", doResize);
            window.addEventListener("mouseup", stopResize);
        }

        /**

         * ===================================================================

        function handleTerminalCommand(e) {
            if (e.key !== "Enter") return;
            const input = e.target;
            const rawCmd = input.value.trim();
            const cmd = rawCmd.toLowerCase();
            const history = document.getElementById("cmd-history");
            const container = document.getElementById("terminal-container");

            let response = "";
            switch (cmd) {
                case "":
                    break;
                case "help":
                    response = `Available commands:
  <span class="text-amber-300">about</span>     - Display developer bio & role
  <span class="text-amber-300">projects</span>  - List featured software projects
  <span class="text-amber-300">skills</span>    - View categorized technical skills
  <span class="text-amber-300">contact</span>   - Show email & social handles
  <span class="text-amber-300">whoami</span>    - Current user session info
  <span class="text-amber-300">date</span>      - Display current system date & time
  <span class="text-amber-300">clear</span>     - Clear terminal screen`;
                    break;
                case "about":
                    response = `<span class="text-white font-bold">${PORTFOLIO_DATA.name}</span> — ${PORTFOLIO_DATA.role}\n${PORTFOLIO_DATA.bio}`;
                    break;
                case "projects":
                    response = PORTFOLIO_DATA.projects.map((p, i) => `[${i + 1}] <span class="text-sky-300 font-bold">${p.title}</span> (${p.tech.join(", ")})`).join("\n");
                    break;
                case "skills":
                    response = Object.entries(PORTFOLIO_DATA.skills).map(([cat, list]) => `<span class="text-amber-300">${cat}:</span> ${list.map(s => s.name).join(", ")}`).join("\n");
                    break;
                case "contact":
                    response = `Email: ${PORTFOLIO_DATA.email}\nGitHub: ${PORTFOLIO_DATA.github}\nLinkedIn: ${PORTFOLIO_DATA.linkedin}`;
                    break;
                case "whoami":
                    response = `visitor@portfolio-os (Viewing ${PORTFOLIO_DATA.name}'s Workstation)`;
                    break;
                case "date":
                    response = new Date().toString();
                    break;
                case "clear":
                    history.innerHTML = "";
                    input.value = "";
                    return;
                default:
                    response = `<span class="text-rose-400">'${rawCmd}' is not recognized as an internal or external command. Type 'help' for commands.</span>`;
            }

            const entry = document.createElement("div");
            entry.innerHTML = `
                <div><span class="text-sky-400">C:\\Users\\Visitor&gt;</span> <span class="text-white">${rawCmd}</span></div>
                ${response ? `<pre class="whitespace-pre-wrap font-mono-code text-slate-300 mt-1 leading-relaxed">${response}</pre>` : ""}
            `;
            history.appendChild(entry);
            input.value = "";
            container.scrollTop = container.scrollHeight;
        }

        /**
         * ===================================================================
         * 9. NOTEPAD, CONTACT FORM, CLOCK & DESKTOP ACTIONS
         * ===================================================================
         */
        function saveNotepad() {
            const text = document.getElementById("notepad-textarea")?.value || "";
            localStorage.setItem("portfolio_os_note", text);
            const status = document.getElementById("notepad-status");
            if (status) status.textContent = "Saved at " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            showToast("Note saved to local storage");
        }

        function handleContactSubmit(e) {
            e.preventDefault();
            e.target.reset();
            showToast(`Message sent to ${PORTFOLIO_DATA.name}!`);
        }

        function copyEmailAddress() {
            const temp = document.createElement("textarea");
            temp.value = PORTFOLIO_DATA.email;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            temp.remove();
            showToast(`Copied: ${PORTFOLIO_DATA.email}`);
        }

        function setWallpaper(num) {
            currentWallpaper = num;
            document.body.className = `wallpaper-${num} relative w-screen h-screen overflow-hidden`;
            showToast(`Wallpaper switched to Theme ${num}`);
        }

        const osActions = {
            refreshDesktop() {
                const icons = document.getElementById("desktop-icons");
                icons.style.opacity = "0.2";
                setTimeout(() => { icons.style.opacity = "1"; }, 160);
                hideContextMenu();
            },
            cycleWallpaper() {
                const next = (currentWallpaper % 4) + 1;
                setWallpaper(next);
                hideContextMenu();
            },
            createNewFolder() {
                customFoldersCount++;
                const container = document.getElementById("desktop-icons");
                const folderName = customFoldersCount === 1 ? "New Folder" : `New Folder (${customFoldersCount})`;
                const btn = document.createElement("button");
                btn.className = "desktop-icon flex flex-col items-center justify-center p-2 rounded-lg border border-transparent text-white text-center group";
                btn.ondblclick = () => openApp("notepad");
                btn.innerHTML = `
                    <div class="w-11 h-11 rounded-xl bg-amber-500/20 backdrop-blur-sm flex items-center justify-center mb-1.5 shadow-md">
                        <i class="fa-solid fa-folder text-amber-400 text-2xl"></i>
                    </div>
                    <span class="text-[11px] font-medium leading-tight drop-shadow">${folderName}</span>
                `;
                container.appendChild(btn);
                hideContextMenu();
                showToast(`Created "${folderName}" on Desktop`);
            },
            lockScreen() {
                toggleStartMenu(false);
                showToast("Screen locked — Click anywhere to unlock");
            },
            restartOS() {
                location.reload();
            }
        };

        function updateClock() {
            const now = new Date();
            document.getElementById("tray-time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            document.getElementById("tray-date").textContent = now.toLocaleDateString();
        }

        function toggleStartMenu(forceState) {
            const menu = document.getElementById("start-menu");
            const tray = document.getElementById("tray-popover");
            tray.classList.add("hidden");

            const shouldOpen = typeof forceState === "boolean" ? forceState : menu.classList.contains("hidden-menu");
            menu.classList.toggle("hidden-menu", !shouldOpen);
        }

        function toggleTray(forceState) {
            const tray = document.getElementById("tray-popover");
            const menu = document.getElementById("start-menu");
            menu.classList.add("hidden-menu");

            const shouldOpen = typeof forceState === "boolean" ? forceState : tray.classList.contains("hidden");
            tray.classList.toggle("hidden", !shouldOpen);
        }

        function hideContextMenu() {
            document.getElementById("context-menu").classList.add("hidden");
        }

        function showToast(message) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "win-glass-dark text-white text-xs px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2.5 animate-bounce";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function setupGlobalListeners() {
            // Desktop Right-Click Context Menu
            document.getElementById("desktop-area").addEventListener("contextmenu", (e) => {
                if (e.target.closest(".os-window")) return;
                e.preventDefault();
                const menu = document.getElementById("context-menu");
                menu.classList.remove("hidden");

                const menuW = 224, menuH = 220;
                const x = Math.min(e.clientX, window.innerWidth - menuW - 10);
                const y = Math.min(e.clientY, window.innerHeight - menuH - 56);
                menu.style.left = `${x}px`;
                menu.style.top = `${y}px`;
            });

            // Close popovers when clicking outside
            document.addEventListener("click", (e) => {
                hideContextMenu();
                if (!e.target.closest("#start-menu") && !e.target.closest("#start-btn")) {
                    toggleStartMenu(false);
                }
                if (!e.target.closest("#tray-popover") && !e.target.closest("#taskbar")) {
                    toggleTray(false);
                }
                if (!e.target.closest(".desktop-icon")) {
                    document.querySelectorAll(".desktop-icon").forEach(el => el.classList.remove("selected"));
                }
            });
        }
    </script>
</body>
</html>
